<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordlister — Rescoring Tool</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --text-muted: #8899aa;
    --accent: #e94560;
    --bucket-0: #e74c3c;
    --bucket-25: #f39c12;
    --bucket-50: #3498db;
    --bucket-60: #2ecc71;
    --bucket-61: #9b59b6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  .container {
    width: 100%;
    max-width: 800px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    flex: 1;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.4rem; font-weight: 600; }
  .header-actions { display: flex; gap: 0.5rem; }
  .btn {
    padding: 0.4rem 1rem;
    border: 1px solid var(--surface2);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--surface2); }
  .btn-save { border-color: var(--bucket-60); color: var(--bucket-60); }
  .btn-save:hover { background: var(--bucket-60); color: #fff; }

  /* Progress */
  .progress-section { display: flex; flex-direction: column; gap: 0.4rem; }
  .progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .progress-bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }

  /* Bucket scale */
  .bucket-scale {
    display: flex;
    justify-content: center;
    gap: 0.25rem;
    padding: 0.5rem 0;
  }
  .bucket-chip {
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    opacity: 0.4;
    transition: opacity 0.2s, transform 0.2s;
    border: 2px solid transparent;
  }
  .bucket-chip.active {
    opacity: 1;
    transform: scale(1.1);
    border-color: #fff;
  }

  /* Word card */
  .word-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    border: 3px solid var(--surface2);
    transition: border-color 0.3s;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    position: relative;
  }
  .word-text {
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }
  .word-meta {
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .word-card.done-state {
    border-color: var(--bucket-60);
  }
  .word-card.done-state .word-text {
    font-size: 1.5rem;
    color: var(--bucket-60);
  }

  /* Score flash */
  .score-flash {
    position: absolute;
    top: 0.75rem;
    right: 1rem;
    font-size: 1rem;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.15s;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
  }
  .score-flash.show { opacity: 1; }
  .score-flash.up { color: var(--bucket-60); }
  .score-flash.down { color: var(--bucket-0); }
  .score-flash.same { color: var(--text-muted); }

  /* Keybindings */
  .keybindings {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .key-hint {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  kbd {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    background: var(--surface2);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    border: 1px solid #334466;
  }

  /* Ticker */
  .ticker {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    min-height: 60px;
    align-items: center;
  }
  .ticker-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    padding: 0.4rem 0.6rem;
    background: var(--surface);
    border-radius: 6px;
    border: 1px solid var(--surface2);
    min-width: 80px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .ticker-icon { font-size: 1.2rem; }
  .ticker-word { font-size: 0.75rem; color: var(--text-muted); }
  .ticker-score { font-size: 0.65rem; font-weight: 600; }

  /* Settings modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 2rem;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid var(--surface2);
  }
  .modal h2 { margin-bottom: 1rem; font-size: 1.2rem; }
  .form-group {
    margin-bottom: 1rem;
  }
  .form-group label {
    display: block;
    margin-bottom: 0.3rem;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .form-group input {
    width: 100%;
    padding: 0.5rem;
    background: var(--bg);
    border: 1px solid var(--surface2);
    color: var(--text);
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .form-row {
    display: flex;
    gap: 1rem;
  }
  .form-row .form-group { flex: 1; }
  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 1.5rem;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    color: var(--text);
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Wordlister</h1>
    <div class="header-actions">
      <button class="btn btn-save" onclick="save()" title="Ctrl+S">Save</button>
      <button class="btn" onclick="openSettings()">Settings</button>
    </div>
  </header>

  <div class="progress-section">
    <div class="progress-header">
      <span id="progress-pct">0%</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="bucket-scale" id="bucket-scale"></div>

  <div class="word-card" id="word-card">
    <div class="word-text" id="word-text">Loading...</div>
    <div class="word-meta" id="word-meta"></div>
    <div class="score-flash" id="score-flash"></div>
  </div>

  <div class="keybindings">
    <span class="key-hint"><kbd>Q</kbd> --</span>
    <span class="key-hint"><kbd>A</kbd> -</span>
    <span class="key-hint"><kbd>Space</kbd> keep</span>
    <span class="key-hint"><kbd>D</kbd> +</span>
    <span class="key-hint"><kbd>E</kbd> ++</span>
    <span class="key-hint"><kbd>U</kbd> undo</span>
  </div>

  <div class="ticker" id="ticker"></div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="form-group">
      <label>Master Wordlist File</label>
      <input type="text" id="s-master">
    </div>
    <div class="form-group">
      <label>Personal Wordlist File</label>
      <input type="text" id="s-personal">
    </div>
    <div class="form-group">
      <label>Tracker File</label>
      <input type="text" id="s-tracker">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Min Word Length</label>
        <input type="number" id="s-len-min" min="1">
      </div>
      <div class="form-group">
        <label>Max Word Length</label>
        <input type="number" id="s-len-max" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Min Score</label>
        <input type="number" id="s-score-min" min="0" max="100">
      </div>
      <div class="form-group">
        <label>Max Score</label>
        <input type="number" id="s-score-max" min="0" max="100">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-save" onclick="saveSettings()">Save & Reload</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ACTIONS = {
  KeyD: "increase",
  KeyA: "decrease",
  Space: "keep",
  KeyQ: "decrease_double",
  KeyE: "increase_double",
};

const ICONS = {
  increase: "\u25B2",
  decrease: "\u25BC",
  keep: "\u25CF",
  increase_double: "\u25B2\u25B2",
  decrease_double: "\u25BC\u25BC",
};

let buckets = {};
let bucketOrder = [];
let locked = false;
let ticker = [];
const MAX_TICKER = 7;

async function api(path, opts) {
  const res = await fetch("/api" + path, opts);
  return res.json();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1500);
}

function updateProgress(done, total) {
  const pct = total > 0 ? ((done / total) * 100).toFixed(1) : 0;
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("progress-count").textContent = done + " / " + total;
  document.getElementById("progress-fill").style.width = pct + "%";
}

function renderBucketScale(activeScore) {
  const el = document.getElementById("bucket-scale");
  el.innerHTML = "";
  // Render in ascending order (worst to best)
  const ordered = [...bucketOrder].reverse();
  for (const score of ordered) {
    const info = buckets[score];
    const chip = document.createElement("span");
    chip.className = "bucket-chip" + (score === activeScore ? " active" : "");
    chip.style.background = info.color + "33";
    chip.style.color = info.color;
    if (score === activeScore) chip.style.borderColor = info.color;
    chip.textContent = info.label;
    el.appendChild(chip);
  }
}

function showWord(data) {
  const card = document.getElementById("word-card");
  const text = document.getElementById("word-text");
  const meta = document.getElementById("word-meta");

  if (!data) {
    card.className = "word-card done-state";
    text.textContent = "All words rescored!";
    meta.textContent = "";
    renderBucketScale(null);
    return;
  }

  card.className = "word-card";
  const color = (buckets[data.score] || {}).color || "#888";
  card.style.borderColor = color;
  text.textContent = data.word;
  meta.textContent = (buckets[data.score] || {}).label || "Score: " + data.score;
  renderBucketScale(data.score);
}

function flashScore(oldScore, newScore, action) {
  const el = document.getElementById("score-flash");
  const diff = newScore - oldScore;
  if (diff > 0) {
    el.textContent = "\u25B2 " + (buckets[newScore] || {}).label;
    el.className = "score-flash show up";
  } else if (diff < 0) {
    el.textContent = "\u25BC " + (buckets[newScore] || {}).label;
    el.className = "score-flash show down";
  } else {
    el.textContent = "kept";
    el.className = "score-flash show same";
  }
  setTimeout(() => { el.classList.remove("show"); }, 600);
}

function addTicker(word, action, oldScore, newScore) {
  const color = (buckets[newScore] || {}).color || "#888";
  ticker.unshift({ word, action, color, oldScore, newScore });
  if (ticker.length > MAX_TICKER) ticker.pop();
  renderTicker();
}

function renderTicker() {
  const el = document.getElementById("ticker");
  el.innerHTML = "";
  for (const item of ticker) {
    const div = document.createElement("div");
    div.className = "ticker-item";

    const icon = document.createElement("div");
    icon.className = "ticker-icon";
    icon.textContent = ICONS[item.action] || "?";
    icon.style.color = item.color;
    div.appendChild(icon);

    const word = document.createElement("div");
    word.className = "ticker-word";
    word.textContent = item.word;
    div.appendChild(word);

    const score = document.createElement("div");
    score.className = "ticker-score";
    score.style.color = item.color;
    score.textContent = (buckets[item.newScore] || {}).label || item.newScore;
    div.appendChild(score);

    el.appendChild(div);
  }
}

async function loadState() {
  const data = await api("/state");
  buckets = {};
  for (const [k, v] of Object.entries(data.buckets)) {
    buckets[parseInt(k)] = v;
  }
  bucketOrder = data.bucket_order;
  updateProgress(data.done, data.total);
  showWord(data.current);
}

document.addEventListener("keydown", async (e) => {
  // Don't capture keys when settings modal is open or input focused
  if (document.getElementById("settings-modal").classList.contains("open")) return;
  if (document.activeElement.tagName === "INPUT") return;

  if (e.code === "KeyS" && !e.ctrlKey) {
    e.preventDefault();
    await save();
    return;
  }
  if ((e.code === "KeyS" && e.ctrlKey)) {
    e.preventDefault();
    await save();
    return;
  }

  if (e.code === "KeyU") {
    e.preventDefault();
    await undo();
    return;
  }

  const action = ACTIONS[e.code];
  if (!action || locked) return;
  e.preventDefault();
  locked = true;

  try {
    const data = await api("/rescore", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action }),
    });

    if (data.done) {
      updateProgress(data.total, data.total);
      showWord(null);
      locked = false;
      return;
    }

    flashScore(data.result.old_score, data.result.new_score, data.result.action);
    addTicker(data.result.word, data.result.action, data.result.old_score, data.result.new_score);
    updateProgress(data.done_count, data.total);

    // Brief delay before showing next word
    setTimeout(() => {
      showWord(data.next);
      locked = false;
    }, 150);
  } catch (err) {
    console.error(err);
    locked = false;
  }
});

async function undo() {
  const data = await api("/undo", { method: "POST", headers: { "Content-Type": "application/json" } });
  if (data.error) {
    toast("Nothing to undo");
    return;
  }
  // Remove most recent ticker item
  if (ticker.length > 0) ticker.shift();
  renderTicker();
  showWord(data.restored);
  updateProgress(data.done_count, data.total);
  toast("Undone: " + data.restored.word);
}

async function save() {
  await api("/save", { method: "POST" });
  toast("Saved!");
}

function openSettings() {
  api("/settings").then(cfg => {
    document.getElementById("s-master").value = cfg.master_wordlist_file || "";
    document.getElementById("s-personal").value = cfg.personal_wordlist_file || "";
    document.getElementById("s-tracker").value = cfg.rescore_tracker_file || "";
    document.getElementById("s-len-min").value = cfg.length_min || 3;
    document.getElementById("s-len-max").value = cfg.length_max || 15;
    document.getElementById("s-score-min").value = cfg.score_min || 0;
    document.getElementById("s-score-max").value = cfg.score_max || 100;
    document.getElementById("settings-modal").classList.add("open");
  });
}

function closeSettings() {
  document.getElementById("settings-modal").classList.remove("open");
}

async function saveSettings() {
  const cfg = {
    master_wordlist_file: document.getElementById("s-master").value,
    personal_wordlist_file: document.getElementById("s-personal").value,
    rescore_tracker_file: document.getElementById("s-tracker").value,
    length_min: document.getElementById("s-len-min").value,
    length_max: document.getElementById("s-len-max").value,
    score_min: document.getElementById("s-score-min").value,
    score_max: document.getElementById("s-score-max").value,
  };
  await api("/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cfg),
  });
  closeSettings();
  ticker = [];
  await loadState();
  toast("Settings saved — queue rebuilt");
}

// Save before tab close
window.addEventListener("beforeunload", (e) => {
  navigator.sendBeacon("/api/save", "");
});

// Init
loadState();
</script>
</body>
</html>
